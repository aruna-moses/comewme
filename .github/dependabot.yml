version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      development-minor-patch:
        patterns: ['*']
        dependency-type: development
        update-types: ['minor', 'patch']
      production-minor-patch:
        patterns: ['*']
        dependency-type: production
        update-types: ['minor', 'patch']
